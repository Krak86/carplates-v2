# Own-model ALPR (license plate recognition) — self-hosted, no token, no
# per-lookup billing. Separate compose file from docker-compose.yml (Postgres)
# so a dev who only needs the DB isn't forced to build the ML image.
name: carplates-v2-alpr

services:
  alpr:
    build:
      context: ../services/alpr
    restart: unless-stopped
    ports:
      - '8088:8088'
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(\"http://localhost:8088/healthz\")"']
      interval: 10s
      timeout: 5s
      retries: 10
