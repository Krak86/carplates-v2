# Local development services only (Postgres, mailpit, optional Redis). Production is infra/docker-compose.prod.yml.
name: carplates-v2

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: carplates
      POSTGRES_PASSWORD: carplates
      POSTGRES_DB: carplates
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # postgres:18+ expects the mount at /var/lib/postgresql (data goes in a
      # version subdirectory), NOT /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carplates -d carplates']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outgoing mail locally: SMTP on 1025, inbox UI on http://localhost:8025.
  # Use with MAIL_TRANSPORT=smtp (SMTP_URL defaults to smtp://localhost:1025).
  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # Optional: shared throttler counters, like production. Without REDIS_URL the api throttles in memory (tests never need this).
  # Try it: `docker compose up -d redis` + REDIS_URL=redis://localhost:6379 in apps/api/.env. No password, bound to localhost only.
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command:
      ['redis-server', '--appendonly', 'yes', '--save', '', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
