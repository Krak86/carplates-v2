# Local development database only. Production compose (Caddy, Redis, API, web,
# ingest cron) lands in Phase 4 as infra/docker-compose.prod.yml.
name: carplates-v2

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: carplates
      POSTGRES_PASSWORD: carplates
      POSTGRES_DB: carplates
    ports:
      - '5432:5432'
    volumes:
      # postgres:18+ expects the mount at /var/lib/postgresql (data goes in a
      # version subdirectory), NOT /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carplates -d carplates']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
