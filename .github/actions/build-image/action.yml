name: build-image
description: Build a Docker image and push it to GHCR as `:<sha>` and `:latest`. The caller checks out first and grants the `packages` write permission.
inputs:
  image:
    description: Image name under ghcr.io/OWNER/, e.g. carsua-api
    required: true
  file:
    description: Dockerfile path
    required: true
  context:
    description: Build context
    required: false
    default: .
  token:
    description: GITHUB_TOKEN for the GHCR login
    required: true
outputs:
  owner:
    description: Lowercased repository owner (the GHCR namespace)
    value: ${{ steps.meta.outputs.owner }}
runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        tags: |
          ghcr.io/${{ steps.meta.outputs.owner }}/${{ inputs.image }}:${{ github.sha }}
          ghcr.io/${{ steps.meta.outputs.owner }}/${{ inputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
