version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Bump PRs land on stage first (security PRs always target the default branch, GitHub limitation).
    target-branch: stage
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: 'chore(deps)' }
    # Counterpart of pnpm minimumReleaseAge: no bump PR for a freshly published release.
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Every entry below mirrors PLAN.md "Version pins"; lift it together with the pin.
      # jsdom ~30.0 pinned: 30.1 breaks `.rejects.toThrow` (see PLAN.md); patches stay allowed.
      - dependency-name: jsdom
        update-types: [version-update:semver-minor, version-update:semver-major]
      # Nest 12 waits for nestjs-zod, TypeScript stays ~5.9 for typescript-eslint.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node tracks the runtime major (Node 24 LTS, .nvmrc); bump it together with the Node pin.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # ioredis is exact 5.11.1 and bullmq depends on exactly that copy: bump both on purpose (PLAN.md).
      - dependency-name: ioredis
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: bullmq
        update-types: [version-update:semver-minor, version-update:semver-major]
      # drizzle-orm stays on 0.45.x until drizzle-kit + drizzle-zod ship stable v1.
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-minor, version-update:semver-major]
      # @tanstack/react-table v9 is a rewrite; the stats table is built on the v8 API.
      - dependency-name: '@tanstack/react-table'
        update-types: [version-update:semver-major]
      # Majors of the toolchain are deliberate migrations (lint rules, compiler, test runner).
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories: ['/apps/api', '/services/alpr', '/scripts']
    target-branch: stage
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node is pinned to 24 LTS (package.json engines, .nvmrc); Python stays on the version the ALPR wheels support.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    # Composite actions are only scanned when listed; build-image holds the docker/* action versions.
    directories: ['/', '/.github/actions/build-image', '/.github/actions/cf-purge', '/.github/actions/ssh-setup']
    target-branch: stage
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    # Actions counterpart of pnpm minimumReleaseAge: no bump PR on the day a release is published.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    # infra/*.yml pin third-party images (postgres, redis, caddy, mailpit).
    directory: /infra
    target-branch: stage
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are deliberate migrations (PLAN.md "Version pins").
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    # Reads requirements.in and regenerates the hash-pinned requirements.txt.
    directory: /services/alpr
    target-branch: stage
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
