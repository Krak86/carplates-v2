name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carplates/shared --filter @carplates/db build # other packages consume dist/
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm format:check
        continue-on-error: true # advisory: docs-only formatting drift must not block the deploy chain
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
