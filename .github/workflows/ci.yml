name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # was pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carplates/shared --filter @carplates/db build # other packages consume dist/
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm format:check
        continue-on-error: true # advisory: docs-only formatting drift must not block the deploy chain
      - run: pnpm test
      - run: pnpm audit --audit-level=high
