name: Deploy ingest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'packages/shared/**'
      - '!packages/shared/src/releases.ts'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infra/vps/run-ingest.sh'
      - 'infra/vps/ingest-status.sh'
      - 'infra/vps/ingest.cron'
      - 'infra/vps/deploy-ingest.sh'
      - 'infra/vps/lib.sh'
      - 'infra/ci/lib.sh'
      - '.github/actions/**'
      - '.github/workflows/deploy-ingest.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: ./.github/actions/build-image
        with:
          image: carsua-ingest
          file: scripts/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Sync compose file and job scripts
        run: rsync -az --inplace infra/docker-compose.prod.yml infra/vps/run-ingest.sh infra/vps/ingest-status.sh infra/vps/ingest.cron infra/vps/lib.sh vps:/opt/carsua/compose/

      - name: Write ingest env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HC_PING_NEWS: ${{ secrets.HC_PING_NEWS }}
          HC_PING_SOCIAL: ${{ secrets.HC_PING_SOCIAL }}
          HC_PING_WANTED: ${{ secrets.HC_PING_WANTED }}
          HC_PING_WANTED_PLATES: ${{ secrets.HC_PING_WANTED_PLATES }}
          HC_PING_AUCTIONS: ${{ secrets.HC_PING_AUCTIONS }}
          HC_PING_PROZORRO_AUCTIONS: ${{ secrets.HC_PING_PROZORRO_AUCTIONS }}
          HC_PING_AUCTION_PROCEEDINGS: ${{ secrets.HC_PING_AUCTION_PROCEEDINGS }}
          HC_PING_PLATES: ${{ secrets.HC_PING_PLATES }}
          HC_PING_DTP_PATROL: ${{ secrets.HC_PING_DTP_PATROL }}
          HC_PING_DTP_HAZARDS: ${{ secrets.HC_PING_DTP_HAZARDS }}
          HC_PING_RDW_RECALLS: ${{ secrets.HC_PING_RDW_RECALLS }}
          HC_PING_CA_RECALLS: ${{ secrets.HC_PING_CA_RECALLS }}
          HC_PING_WIKI_PAINT: ${{ secrets.HC_PING_WIKI_PAINT }}
        run: |
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is missing}"
          . infra/ci/lib.sh # emit, push_env
          {
            printf 'DATABASE_URL=postgres://carplates:%s@postgres:5432/carplates\n' "$POSTGRES_PASSWORD"
            emit HC_PING_NEWS HC_PING_SOCIAL HC_PING_WANTED HC_PING_WANTED_PLATES HC_PING_AUCTIONS HC_PING_PROZORRO_AUCTIONS HC_PING_AUCTION_PROCEEDINGS HC_PING_PLATES HC_PING_DTP_PATROL HC_PING_DTP_HAZARDS HC_PING_RDW_RECALLS HC_PING_CA_RECALLS HC_PING_WIKI_PAINT
          } > ingest.env
          push_env ingest.env /opt/carsua/env/ingest.env
          rm -f ingest.env

      - name: Pull the image and install the crontab
        run: ssh vps bash -s -- "$GITHUB_SHA" < infra/vps/deploy-ingest.sh
