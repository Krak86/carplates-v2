name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'First setup: copy compose files + secrets and start only Postgres (restore the DB dump, then run again without this)'
        type: boolean
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: ./.github/actions/build-image
        with:
          image: carsua-api
          file: apps/api/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production # restricted to main; add required reviewers there if you want a click-to-deploy gate
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Sync compose files
        # --inplace: Caddy bind-mounts single files, and a rename would leave the container on the old inode.
        run: |
          rsync -az --inplace infra/docker-compose.prod.yml infra/Caddyfile infra/maintenance.html infra/vps/backup.sh infra/vps/lib.sh vps:/opt/carsua/compose/

      - name: Write env files and origin certificate
        env:
          GH_OWNER: ${{ needs.build.outputs.owner }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          MAIL_FROM_NEWS: ${{ vars.MAIL_FROM_NEWS }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PLATE_RECOGNIZER_CLOUD_TOKEN: ${{ secrets.PLATE_RECOGNIZER_CLOUD_TOKEN }}
          PLATE_RECOGNIZER_CLOUD_ENABLED: ${{ vars.PLATE_RECOGNIZER_CLOUD_ENABLED }}
          RIA_CHECK_ENABLED: ${{ vars.RIA_CHECK_ENABLED }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CARAPIS_API_KEY: ${{ secrets.CARAPIS_API_KEY }}
          MARKET_UA_ENABLED: ${{ vars.MARKET_UA_ENABLED }}
          MARKET_SHOW_BUDGET: ${{ vars.MARKET_SHOW_BUDGET }}
          ALARM_API_KEY: ${{ secrets.ALARM_API_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          ENABLE_TELEMETRY: ${{ vars.ENABLE_TELEMETRY }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          HC_PING_BACKUP: ${{ secrets.HC_PING_BACKUP }}
          ALPR_API_KEY: ${{ secrets.ALPR_API_KEY }}
          # Shared photo links: a bucket-scoped R2 token (not the backup one); same account, so the same endpoint.
          SHARES_R2_ACCESS_KEY_ID: ${{ secrets.SHARES_R2_ACCESS_KEY_ID }}
          SHARES_R2_SECRET_ACCESS_KEY: ${{ secrets.SHARES_R2_SECRET_ACCESS_KEY }}
          SHARES_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SHARES_R2_BUCKET: ${{ vars.SHARES_R2_BUCKET }}
        run: |
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is missing}"
          : "${AUTH_SECRET:?AUTH_SECRET secret is missing}"

          # emit (only non-empty values are written, so an unset optional feature stays "not configured" in env.ts) and push_env.
          . infra/ci/lib.sh

          {
            printf 'DATABASE_URL=postgres://carplates:%s@postgres:5432/carplates\n' "$POSTGRES_PASSWORD"
            printf 'GIT_SHA=%s\n' "$GITHUB_SHA"
            emit AUTH_SECRET PUBLIC_SITE_URL MAIL_TRANSPORT MAIL_FROM MAIL_REPLY_TO MAIL_FROM_NEWS DIGEST_ENABLED RESEND_API_KEY CONTACT_TO SMTP_URL \
              GOOGLE_CLIENT_ID TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
              PLATE_RECOGNIZER_CLOUD_TOKEN PLATE_RECOGNIZER_CLOUD_ENABLED RIA_CHECK_ENABLED PIXABAY_API_KEY \
              CARAPIS_API_KEY MARKET_UA_ENABLED MARKET_SHOW_BUDGET ALARM_API_KEY \
              POSTHOG_PERSONAL_API_KEY POSTHOG_PROJECT_ID POSTHOG_API_HOST CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID SENTRY_DSN SENTRY_ORG_SLUG ENABLE_TELEMETRY ALPR_API_KEY \
              SHARES_R2_ENDPOINT SHARES_R2_BUCKET SHARES_R2_ACCESS_KEY_ID SHARES_R2_SECRET_ACCESS_KEY
          } > api.env
          emit ALPR_API_KEY > alpr.env
          printf 'POSTGRES_USER=carplates\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=carplates\n' "$POSTGRES_PASSWORD" > postgres.env

          push_env api.env /opt/carsua/env/api.env
          push_env postgres.env /opt/carsua/env/postgres.env
          push_env alpr.env /opt/carsua/env/alpr.env
          # GH_OWNER lives in compose/.env next to the colour tags; replace just that line (lib.sh was synced above).
          ssh vps bash -s -- "$GH_OWNER" <<'REMOTE'
          . /opt/carsua/compose/lib.sh
          set_env GH_OWNER "$1"
          REMOTE
          if [ -n "$CF_ORIGIN_CERT" ] && [ -n "$CF_ORIGIN_KEY" ]; then
            printf '%s\n' "$CF_ORIGIN_CERT" | ssh vps 'umask 077; cat > /opt/carsua/env/certs/origin.pem'
            printf '%s\n' "$CF_ORIGIN_KEY" | ssh vps 'umask 077; cat > /opt/carsua/env/certs/origin.key'
          fi
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$BACKUP_BUCKET" ]; then
            {
              printf 'RCLONE_CONFIG_R2_TYPE=s3\nRCLONE_CONFIG_R2_PROVIDER=Cloudflare\nRCLONE_CONFIG_R2_NO_CHECK_BUCKET=true\n'
              printf 'RCLONE_CONFIG_R2_ACCESS_KEY_ID=%s\nRCLONE_CONFIG_R2_SECRET_ACCESS_KEY=%s\nRCLONE_CONFIG_R2_ENDPOINT=%s\n' \
                "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_ENDPOINT"
              emit BACKUP_BUCKET HC_PING_BACKUP
            } > backup.env
            push_env backup.env /opt/carsua/env/backup.env
          fi
          rm -f api.env alpr.env postgres.env backup.env

      - name: Start Postgres only (sync_only)
        if: ${{ inputs.sync_only }}
        run: ssh vps 'cd /opt/carsua/compose && COMPOSE_FILE=docker-compose.prod.yml docker compose up -d postgres'

      - name: Blue/green switch
        if: ${{ !inputs.sync_only }}
        run: ssh vps bash -s -- "$GITHUB_SHA" < infra/vps/deploy-api.sh

      # Advisory only: Cloudflare Bot Fight Mode serves GitHub runner IPs a Managed Challenge (403), and the blue/green
      # step above already health-checked the new container on the origin. UptimeRobot watches the public /healthz.
      - name: Public health check
        if: ${{ !inputs.sync_only }}
        env:
          URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          for _ in $(seq 1 3); do
            curl -fsS --max-time 10 "$URL/healthz" && exit 0
            sleep 5
          done
          echo "::warning::public /healthz not reachable from the runner (Cloudflare Bot Fight Mode challenges CI IPs); origin check already passed"

      # The api renders the /og/*.png link-preview cards and Cloudflare caches them for 24 h, so a new api build
      # (fonts, layout, data) would otherwise keep serving the old cards. robots.txt and sitemap.xml are edge-cached too and
      # change with the api build. Best-effort: the deploy itself already succeeded.
      # /cars* HTML (s-maxage 1 day) embeds the hashed web asset names and the server-rendered tags, so it must go with the build;
      # /api/catalog/ answers are edge-cached 1 day too.
      # Exact URLs first: they work on every plan, so robots/sitemap are purged even if the prefix purge is refused.
      - name: Purge Cloudflare cache for robots.txt, sitemaps and stats
        if: ${{ !inputs.sync_only }}
        uses: ./.github/actions/cf-purge
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          zone-id: ${{ secrets.CF_ZONE_ID }}
          site-url: ${{ vars.PUBLIC_SITE_URL }}
          files: >-
            /robots.txt /sitemap.xml /sitemap-pages.xml /sitemap-cars.xml /api/stats /api/stats/top /api/stats/distribution
            /api/stats/size-models /api/stats/ev /api/stats/imports /api/stats/origin /api/stats/region-brands /api/stats/brands
            /api/stats/region-facets
          warn-on-failure: robots.txt/sitemap/stats cache purge failed; purge manually

      - name: Purge Cloudflare cache for the link-preview cards and catalog pages
        if: ${{ !inputs.sync_only }}
        uses: ./.github/actions/cf-purge
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          zone-id: ${{ secrets.CF_ZONE_ID }}
          site-url: ${{ vars.PUBLIC_SITE_URL }}
          prefixes: /og/ /cars /api/catalog/ /api/stats/
          warn-on-failure: og card / catalog cache purge failed (purge by prefix may need a paid plan; purge manually)

      # IndexNow tells Bing, Yandex and the other participating engines which URLs to recrawl. The sitemap is the URL list
      # (up to 10,000 per request): /sitemap.xml is an index, so each child sitemap is read in turn. Widening the catalog past
      # 10,000 URLs needs this split into several requests. Best-effort like the purge.
      - name: Ping IndexNow with the sitemap URLs
        if: ${{ !inputs.sync_only }}
        env:
          URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          key=$(sed -n "s/.*INDEXNOW_KEY = '\([a-f0-9]*\)'.*/\1/p" apps/api/src/spa/indexnow.ts)
          host="${URL#https://}"
          files=$(curl -fsS --max-time 20 "$URL/sitemap.xml" | sed -n 's|.*<loc>\([^<]*\)</loc>.*|\1|p') \
            || { echo "::warning::sitemap not reachable from the runner; skipping IndexNow"; exit 0; }
          urls=$(for f in $files; do curl -fsS --max-time 30 "$f" | sed -n 's|.*<loc>\([^<]*\)</loc>.*|\1|p'; done | jq -R . | jq -s .) \
            || { echo "::warning::sitemap files not reachable from the runner; skipping IndexNow"; exit 0; }
          echo "IndexNow: $(echo "$urls" | jq length) URL(s)"
          jq -n --arg host "$host" --arg key "$key" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}' \
            | curl -fsS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data @- \
            || echo "::warning::IndexNow ping failed (best-effort)"
