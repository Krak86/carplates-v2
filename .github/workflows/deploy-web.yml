name: Deploy Web

# Reusable: called only by deploy.yml, which orders every component (build all, then deploy api -> ingest -> alpr -> web).
# The build phase uploads apps/web/dist as an artifact; the deploy phase (last in the chain) ships it, so a new web build never
# goes live in front of an api that failed to deploy. No triggers and no concurrency group of its own: deploy.yml holds the lock.
on:
  workflow_call:
    inputs:
      phase:
        description: 'build = build the SPA and keep it as a run artifact; deploy = upload it to the VPS and switch'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.phase == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the app version is the commit count
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # was pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @carplates/web...
      - run: pnpm --filter @carplates/shared build

      - name: Fetch ZAKON font
        # The font is git-ignored; without it the ZAKON face falls back. Plain node (24 strips types), so no scripts-package install.
        run: node scripts/src/fetch-zakon-font.ts

      - name: Build web
        # Everything VITE_* is public once bundled, so these are variables, not secrets.
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_DISQUS_SHORT_NAME: ${{ vars.VITE_DISQUS_SHORT_NAME }}
          VITE_ENABLE_TELEMETRY: ${{ vars.VITE_ENABLE_TELEMETRY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ vars.VITE_GOOGLE_MAPS_EMBED_KEY }}
        run: pnpm --filter @carplates/web build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          include-hidden-files: true # public/.well-known
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: ${{ inputs.phase == 'deploy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Upload release and switch
        run: |
          rsync -az --delete apps/web/dist/ "vps:/opt/carsua/web/releases/$GITHUB_SHA/"
          ssh vps bash -s -- "$GITHUB_SHA" < infra/vps/deploy-web.sh

      - name: Purge Cloudflare cache for the entry files
        uses: ./.github/actions/cf-purge
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          zone-id: ${{ secrets.CF_ZONE_ID }}
          site-url: ${{ vars.PUBLIC_SITE_URL }}
          files: / /index.html /sw.js /registerSW.js /manifest.webmanifest
