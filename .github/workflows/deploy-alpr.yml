name: Deploy ALPR

# Reusable: called only by deploy.yml, which orders every component (build all, then deploy api -> ingest -> alpr -> web).
# No triggers and no concurrency group of its own: deploy.yml holds the single `deploy-production` lock.
on:
  workflow_call:
    inputs:
      phase:
        description: 'build = push the image to GHCR; deploy = roll the container on the VPS'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.phase == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: carsua-alpr
          context: services/alpr
          file: services/alpr/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: ${{ inputs.phase == 'deploy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      - name: Sync helpers
        run: rsync -az --inplace infra/vps/lib.sh vps:/opt/carsua/compose/
      - name: Roll the container
        run: ssh vps bash -s -- "$GITHUB_SHA" < infra/vps/deploy-alpr.sh
