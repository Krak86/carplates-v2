name: Deploy ALPR

on:
  push:
    branches: [main]
    paths:
      - 'services/alpr/**'
      - '.github/workflows/deploy-alpr.yml'
  workflow_dispatch:

concurrency:
  group: deploy-alpr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/alpr
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/carsua-alpr:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/carsua-alpr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      - name: Roll the container
        run: |
          ssh vps bash -s -- "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          cd /opt/carsua/compose
          export COMPOSE_FILE=docker-compose.prod.yml
          touch .env
          { grep -v '^ALPR_TAG=' .env || true; echo "ALPR_TAG=$1"; } > .env.tmp && mv .env.tmp .env
          docker compose pull alpr
          docker compose up -d --no-deps alpr
          cid="$(docker compose ps -q alpr)"
          for _ in $(seq 1 45); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" = healthy ] && { echo "alpr healthy"; exit 0; }
            sleep 2
          done
          docker compose logs --tail 50 alpr >&2
          echo "alpr did not become healthy" >&2
          exit 1
          EOF
