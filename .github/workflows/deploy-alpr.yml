name: Deploy ALPR

on:
  push:
    branches: [main]
    paths:
      - 'services/alpr/**'
      - 'infra/vps/deploy-alpr.sh'
      - 'infra/vps/lib.sh'
      - '.github/actions/**'
      - '.github/workflows/deploy-alpr.yml'
  workflow_dispatch:

concurrency:
  group: deploy-alpr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: ./.github/actions/build-image
        with:
          image: carsua-alpr
          context: services/alpr
          file: services/alpr/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      - name: Sync helpers
        run: rsync -az --inplace infra/vps/lib.sh vps:/opt/carsua/compose/
      - name: Roll the container
        run: ssh vps bash -s -- "$GITHUB_SHA" < infra/vps/deploy-alpr.sh
