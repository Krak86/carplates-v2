# SonarQube Cloud (sonarcloud.io). Confirm both values against the project page after importing the repo.
sonar.organization=carsua-v2
sonar.projectKey=carsua-v2_carplates-v2

sonar.sources=apps,packages,scripts,services/alpr
sonar.exclusions=**/node_modules/**,**/dist/**,**/seed-data/**,**/fixtures/**,**/*.test.ts,**/*.test.tsx,services/alpr/test_*.py
sonar.tests=apps,packages,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.config.*,scripts/**,**/main.tsx
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,packages/shared/src/releases/**,**/i18n/**
