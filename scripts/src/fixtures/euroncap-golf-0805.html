<html><body>
<!-- Trimmed real markup from https://www.euroncap.com/assessments/volkswagen/golf/0805/ —
     an older (2019), now-expired rating: same component shapes as the current CLA page,
     confirming the site normalizes historic tests into one consistent markup. -->
<div data-component="vehicle-info">
  <div class="flex flex-wrap items-center gap-2 justify-end">
    <div class="flex items-center justify-center gap-2 px-4 py-[5px] rounded-[40px] bg-theme-badge-red-bg" data-component="vehicle-badge">
      <div data-testid="badge-icon"><img src="https://cdn.euroncap.com/cars/assets/Rating_Expired_559376ca22.svg" alt=""></div>
      <span class="text-body-sm-bold text-center">Expired</span>
    </div>
  </div>
  <div data-component="vehicle-year-stars" data-rating-type="safety">
    <span class="text-theme-rating-pill-text font-normal leading-[1.4] text-center text-body-md"><span class="font-normal">2019</span></span>
    <div data-component="stars">
      <div class="flex items-center justify-center gap-[7.37px] " data-component="star-rating">
        <span class="w-5 h-5 bg-primary-yellow icon-star"></span>
        <span class="w-5 h-5 bg-primary-yellow icon-star"></span>
        <span class="w-5 h-5 bg-primary-yellow icon-star"></span>
        <span class="w-5 h-5 bg-primary-yellow icon-star"></span>
        <span class="w-5 h-5 bg-primary-yellow icon-star"></span>
      </div>
    </div>
  </div>

  <div data-component="table-data">
    <div data-component="table-grid">
      <div data-component="table-row">
        <span data-component="table-label">Tested model</span>
        <span data-component="table-value">VW Golf, 1.5 petrol 'Comfortline', LHD</span>
      </div>
      <div data-component="table-row">
        <span data-component="table-label">Body type</span>
        <span data-component="table-value">Hatchback</span>
      </div>
      <div data-component="table-row">
        <span data-component="table-label">Kerb weight</span>
        <span data-component="table-value">1316 kg</span>
      </div>
    </div>
  </div>

  <div role="list">
    <div role="listitem"><div data-component="pillar-card">
      <h3 class="text-heading-4">Adult Occupant</h3>
      <span class="text-theme-pillar-card-score">95%</span>
    </div></div>
    <div role="listitem"><div data-component="pillar-card">
      <h3 class="text-heading-4">Child Occupant</h3>
      <span class="text-theme-pillar-card-score">89%</span>
    </div></div>
    <div role="listitem"><div data-component="pillar-card">
      <h3 class="text-heading-4">Vulnerable Road Users</h3>
      <span class="text-theme-pillar-card-score">76%</span>
    </div></div>
    <div role="listitem"><div data-component="pillar-card">
      <h3 class="text-heading-4">Safety Assist</h3>
      <span class="text-theme-pillar-card-score">78%</span>
    </div></div>
  </div>

  <div data-component="assessment-card-carousel">
    <img alt="Golf frontal view" src="https://data-cdn.euroncap.com/media/assessment-media/aa11bb22-cc33-dd44-ee55-ff6677889900/volkswagen-golf-2019-0805_0__abc123_xl.webp">
    <img alt="test picture" src="https://data-cdn.euroncap.com/media/assessment-media/aa11bb22-cc33-dd44-ee55-ff6677889900/volkswagen-golf-2019-0805_FW__def456_xl.webp">
  </div>

  <div data-component="attachments">
    <button aria-label="Euro NCAP safety report: Download the detailed safety assessment for this vehicle.">
      <h3>Euro NCAP safety report</h3>
    </button>
    <a href="https://euroncaprescuesheets.blob.core.windows.net/rescuesheets/Volkswagen/Volkswagen_Golf__Hatchback_2020_5d_GD_EN.pdf">Emergency rescue sheet</a>
  </div>
</div>
</body></html>
