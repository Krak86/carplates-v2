<html>
  <body>
    <!-- Trimmed real markup shape from https://www.euroncap.com/assessments/dacia/spring/0910/ —
     a 1-star rating, confirming ALL FIVE .icon-star spans are always present; only the
     fill class (bg-primary-yellow vs bg-dark-grey) changes with the star count. No
     vehicle-badge element at all here (that only appears for "Expired"/"Best in Class"),
     and no youtube/pdf markup, to exercise the all-absent-media path.
     Percentages below are illustrative placeholders for the parser test, not the real
     published Dacia Spring scores. -->
    <div data-component="vehicle-info">
      <div data-component="vehicle-year-stars" data-rating-type="safety">
        <span class="font-normal">2021</span>
        <div data-component="stars">
          <div class="flex items-center justify-center gap-[7.37px]" data-component="star-rating">
            <span class="bg-primary-yellow icon-star h-5 w-5"></span>
            <span class="bg-dark-grey icon-star h-5 w-5"></span>
            <span class="bg-dark-grey icon-star h-5 w-5"></span>
            <span class="bg-dark-grey icon-star h-5 w-5"></span>
            <span class="bg-dark-grey icon-star h-5 w-5"></span>
          </div>
        </div>
      </div>

      <div data-component="table-data">
        <div data-component="table-grid">
          <div data-component="table-row">
            <span data-component="table-label">Tested model</span>
            <span data-component="table-value">Dacia Spring, Electric 65, 'Comfort', LHD</span>
          </div>
          <div data-component="table-row">
            <span data-component="table-label">Body type</span>
            <span data-component="table-value">Hatchback</span>
          </div>
        </div>
      </div>

      <div role="list">
        <div role="listitem">
          <div data-component="pillar-card">
            <h3 class="text-heading-4">Adult Occupant</h3>
            <span class="text-theme-pillar-card-score">63%</span>
          </div>
        </div>
        <div role="listitem">
          <div data-component="pillar-card">
            <h3 class="text-heading-4">Child Occupant</h3>
            <span class="text-theme-pillar-card-score">82%</span>
          </div>
        </div>
        <div role="listitem">
          <div data-component="pillar-card">
            <h3 class="text-heading-4">Vulnerable Road Users</h3>
            <span class="text-theme-pillar-card-score">63%</span>
          </div>
        </div>
        <div role="listitem">
          <div data-component="pillar-card">
            <h3 class="text-heading-4">Safety Assist</h3>
            <span class="text-theme-pillar-card-score">59%</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
