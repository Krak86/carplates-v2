<!doctype html>
<meta charset="utf-8" />
<title>racer render</title>
<body style="margin: 0; background: #888">
  <canvas id="c"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js'

    const SIZE = 512
    const canvas = document.getElementById('c')
    canvas.width = canvas.height = SIZE
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true })
    renderer.setSize(SIZE, SIZE, false)
    renderer.setClearColor(0x000000, 0)

    const loader = new GLTFLoader()
    const gltfCache = {}
    const load = async name => (gltfCache[name] ??= await loader.loadAsync(`/${name}.glb`))

    const img = await new Promise(r => {
      const i = new Image()
      i.onload = () => r(i)
      i.src = '/colormap.png'
    })
    const CELL = 32 // swatches are 32px columns (two per colour)

    /** Colormap copy: cells in `body` -> grey (`mask` false) or white (`mask` true); everything else untouched / black. */
    function makeMap(body, mask, highlight) {
      const c = document.createElement('canvas')
      c.width = c.height = 512
      const g = c.getContext('2d')
      if (mask) {
        g.fillStyle = '#000'
        g.fillRect(0, 0, 512, 512)
      } else g.drawImage(img, 0, 0)
      for (const [cx, cy] of body) {
        g.fillStyle = mask ? '#fff' : '#f4f4f4'
        g.fillRect(cx * CELL, cy * 128, CELL, 128)
      }
      if (highlight) {
        g.fillStyle = '#f0f'
        for (const [cx, cy] of highlight) g.fillRect(cx * CELL, cy * 128, CELL, 128)
      }
      const t = new THREE.CanvasTexture(c)
      t.flipY = false
      t.colorSpace = THREE.SRGBColorSpace
      t.magFilter = THREE.NearestFilter
      return t
    }

    window.renderModel = async (name, o = {}) => {
      const { body = [], mask = false, yaw = 0, elev = 8, highlight, fov = 14 } = o
      const gltf = await load(name)
      const scene = new THREE.Scene()
      const model = gltf.scene.clone(true)
      const map = makeMap(body, mask, highlight)
      model.traverse(m => {
        if (!m.isMesh) return
        m.material = mask
          ? new THREE.MeshBasicMaterial({ map })
          : new THREE.MeshStandardMaterial({ map, roughness: 0.55, metalness: 0.0 })
      })
      scene.add(model)
      if (!mask) {
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.1))
        const sun = new THREE.DirectionalLight(0xffffff, 1.3)
        sun.position.set(2, 5, -4)
        scene.add(sun)
      }
      const box = new THREE.Box3().setFromObject(model)
      const centre = box.getCenter(new THREE.Vector3())
      const size = box.getSize(new THREE.Vector3())
      const cam = new THREE.PerspectiveCamera(fov, 1, 0.1, 100)
      const r = 14
      const a = (yaw * Math.PI) / 180
      const e = (elev * Math.PI) / 180
      // rear view: camera behind the car (Kenney cars face +Z? decided by `flip`)
      const dir = o.flip ? 1 : -1
      cam.position.set(
        centre.x + Math.sin(a) * r * dir,
        centre.y + Math.sin(e) * r,
        centre.z + Math.cos(a) * r * dir * -1 * -1
      )
      cam.position.set(
        centre.x + Math.sin(a) * Math.cos(e) * r,
        centre.y + Math.sin(e) * r,
        centre.z + dir * Math.cos(a) * Math.cos(e) * r
      )
      cam.lookAt(centre)
      renderer.render(scene, cam)
      return { size: size.toArray(), data: canvas.toDataURL('image/png') }
    }

    /** Texture cells (32px swatches) a model uses, with the 3D surface area painted from each — body paint is the big coloured one. */
    window.cellsOf = async (name, all) => {
      const gltf = await load(name)
      const out = {}
      const a = new THREE.Vector3(),
        b = new THREE.Vector3(),
        c = new THREE.Vector3()
      gltf.scene.updateMatrixWorld(true)
      gltf.scene.traverse(m => {
        if (!m.isMesh) return
        const pos = m.geometry.attributes.position,
          uv = m.geometry.attributes.uv
        const idx = m.geometry.index
        const n = idx ? idx.count : pos.count
        for (let i = 0; i < n; i += 3) {
          const [i0, i1, i2] = idx ? [idx.getX(i), idx.getX(i + 1), idx.getX(i + 2)] : [i, i + 1, i + 2]
          a.fromBufferAttribute(pos, i0).applyMatrix4(m.matrixWorld)
          b.fromBufferAttribute(pos, i1).applyMatrix4(m.matrixWorld)
          c.fromBufferAttribute(pos, i2).applyMatrix4(m.matrixWorld)
          const area = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2
          const u = (uv.getX(i0) + uv.getX(i1) + uv.getX(i2)) / 3,
            v = (uv.getY(i0) + uv.getY(i1) + uv.getY(i2)) / 3
          const key = Math.floor(u * 16) + ',' + Math.floor(v * 4)
          out[key] = (out[key] ?? 0) + area
        }
      })
      return Object.entries(out)
        .sort((x, y) => y[1] - x[1])
        .map(([k, v]) => k + ':' + v.toFixed(2))
    }
    const sampler = (() => {
      const c = document.createElement('canvas')
      c.width = c.height = 512
      const g = c.getContext('2d')
      g.drawImage(img, 0, 0)
      return g
    })()
    /** Body paint = the largest-area cell whose swatch is clearly coloured (not the grey/black/white trim). */
    window.guessBody = async name => {
      for (const entry of await window.cellsOf(name, true)) {
        const [cx, cy] = entry.split(':')[0].split(',').map(Number)
        const [r, g, b] = sampler.getImageData(cx * 32 + 16, cy * 128 + 64, 1, 1).data
        const mx = Math.max(r, g, b),
          mn = Math.min(r, g, b)
        if (mx > 0 && (mx - mn) / mx > 0.3 && !(cx === 5 && cy === 2)) return [[cx, cy]]
      }
      return []
    }
    window.sheet = async names => {
      const c = document.createElement('canvas')
      c.width = 128 * 2 * 6
      c.height = 128 * Math.ceil(names.length / 6)
      document.body.appendChild(c)
      const g = c.getContext('2d')
      let i = 0
      for (const n of names) {
        const body = await window.guessBody(n)
        for (const [k, mask] of [
          [0, false],
          [1, true]
        ]) {
          const r = await window.renderModel(n, { body, mask })
          const im = await new Promise(res => {
            const x = new Image()
            x.onload = () => res(x)
            x.src = r.data
          })
          g.drawImage(im, ((i % 6) * 2 + k) * 128, Math.floor(i / 6) * 128, 128, 128)
        }
        i++
      }
    }
    const PX_PER_UNIT = 144
    const LOGICAL_PER_UNIT = 53.3 // a 1.5-unit-wide Kenney sedan = the 80-unit-wide procedural sedan it replaces
    const nextFrame = () => new Promise(r => requestAnimationFrame(r))

    async function toImage(dataUrl) {
      return new Promise(res => {
        const x = new Image()
        x.onload = () => res(x)
        x.src = dataUrl
      })
    }

    /** Renders one model (rear view) and posts sprite files. Tintable models also get a transparent body mask. */
    /**
     * Models that are not Kenney colormap meshes (Quaternius OBJ bus, Sketchfab GLB motorbike): a spec names the file,
     * the camera yaw that looks at the rear, the target rear width (world units), the materials that are body paint
     * (grey in the base render, white in the mask) and optional flat colours per material for OBJ files whose MTL has none.
     */
    const customCache = {}
    async function loadCustom(file) {
      if (customCache[file]) return customCache[file]
      let m
      if (file.endsWith('.glb')) m = (await loader.loadAsync('/' + file)).scene
      else {
        const mats = await new MTLLoader().loadAsync('/' + file.replace('.obj', '.mtl'))
        mats.preload()
        m = await new OBJLoader().setMaterials(mats).loadAsync('/' + file)
      }
      return (customCache[file] = m)
    }

    window.renderCustom = async (spec, yaw, mask) => {
      const { file, rearYaw, width, widthAxis = 'x', body = [], colors = {}, hide = [], elev = 8, fov = 14 } = spec
      const model = (await loadCustom(file)).clone(true)
      // `hide`: materials of helper meshes baked into the model (ground-shadow planes) — removed so they don't widen the crop
      const drop = []
      model.traverse(m => {
        if (m.isMesh && [].concat(m.material).every(x => hide.includes(x.name))) drop.push(m)
      })
      drop.forEach(m => m.parent.remove(m))
      model.traverse(m => {
        if (!m.isMesh) return
        const swap = x => {
          const isBody = body.includes(x.name)
          if (mask) return new THREE.MeshBasicMaterial({ color: isBody ? 0xffffff : 0x000000 })
          if (isBody) return new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.5 })
          if (colors[x.name]) return new THREE.MeshStandardMaterial({ color: colors[x.name], roughness: 0.55 })
          return x
        }
        m.material = Array.isArray(m.material) ? m.material.map(swap) : swap(m.material)
      })
      const scene = new THREE.Scene()
      const box0 = new THREE.Box3().setFromObject(model)
      const k = width / box0.getSize(new THREE.Vector3())[widthAxis]
      model.scale.multiplyScalar(k)
      scene.add(model)
      if (!mask) {
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.1))
        const sun = new THREE.DirectionalLight(0xffffff, 1.3)
        sun.position.set(2, 5, 4)
        scene.add(sun)
      }
      const box = new THREE.Box3().setFromObject(model)
      const centre = box.getCenter(new THREE.Vector3())
      const cam = new THREE.PerspectiveCamera(fov, 1, 0.1, 100)
      const a = ((rearYaw + yaw) * Math.PI) / 180
      const e = (elev * Math.PI) / 180
      const r = 14
      cam.position.set(
        centre.x + Math.sin(a) * Math.cos(e) * r,
        centre.y + Math.sin(e) * r,
        centre.z + Math.cos(a) * Math.cos(e) * r
      )
      cam.lookAt(centre)
      renderer.render(scene, cam)
      return { data: canvas.toDataURL('image/png') }
    }

    window.exportModel = async (name, { body = null, steer = true, shadow = true, custom = null } = {}) => {
      const rm = async (yaw, mask) =>
        custom
          ? window.renderCustom(custom, yaw, mask)
          : window.renderModel(name, mask ? { body, mask: true, yaw } : { body: body ?? [], yaw })
      const sy = custom?.steer ?? 14
      const yaws = steer ? { '': 0, '-l': -sy, '-r': sy } : { '': 0 }
      const views = {}
      const box = { x0: 1e9, y0: 1e9, x1: -1, y1: -1 }
      for (const [suffix, yaw] of Object.entries(yaws)) {
        const base = await toImage((await rm(yaw, false)).data)
        const mask = body ? await toImage((await rm(yaw, true)).data) : null
        views[suffix] = { base, mask }
        const g = document.createElement('canvas')
        g.width = g.height = 512
        const gg = g.getContext('2d')
        gg.drawImage(base, 0, 0, 512, 512)
        const d = gg.getImageData(0, 0, 512, 512).data
        for (let y = 0; y < 512; y++)
          for (let x = 0; x < 512; x++)
            if (d[(y * 512 + x) * 4 + 3] > 8) {
              box.x0 = Math.min(box.x0, x)
              box.x1 = Math.max(box.x1, x)
              box.y0 = Math.min(box.y0, y)
              box.y1 = Math.max(box.y1, y)
            }
      }
      const pad = shadow ? 10 : 2
      const x0 = Math.max(0, box.x0 - pad),
        x1 = Math.min(511, box.x1 + pad),
        y0 = Math.max(0, box.y0 - 2),
        y1 = Math.min(511, box.y1 + pad)
      const w = x1 - x0 + 1,
        h = y1 - y0 + 1
      const plates = {}
      for (const [suffix, yaw] of Object.entries(yaws)) {
        if (custom) {
          const [fx, fy, fw, fh] = custom.plate
          plates[name + suffix] = [Math.round(fx * w), Math.round(fy * h), Math.round(fw * w), Math.round(fh * h)]
          continue
        }
        const pm = await toImage((await window.renderModel(name, { body: [[13, 2]], mask: true, yaw })).data)
        const g = document.createElement('canvas')
        g.width = g.height = 512
        const gg = g.getContext('2d')
        gg.drawImage(pm, 0, 0, 512, 512)
        const d = gg.getImageData(0, 0, 512, 512).data
        const cx = (box.x0 + box.x1) / 2,
          half = (box.x1 - box.x0) * 0.16
        const r = { x0: 1e9, y0: 1e9, x1: -1, y1: -1 }
        for (let y = Math.floor(box.y0 + (box.y1 - box.y0) * 0.6); y <= box.y1; y++)
          for (let x = Math.floor(cx - half); x <= cx + half; x++) {
            if (d[(y * 512 + x) * 4] > 128 && d[(y * 512 + x) * 4 + 3] > 128) {
              r.x0 = Math.min(r.x0, x)
              r.x1 = Math.max(r.x1, x)
              r.y0 = Math.min(r.y0, y)
              r.y1 = Math.max(r.y1, y)
            }
          }
        plates[name + suffix] = r.x1 < 0 ? null : [r.x0 - x0, r.y0 - y0, r.x1 - r.x0 + 1, r.y1 - r.y0 + 1]
      }
      const meta = {
        plates,
        w: +(w / (PX_PER_UNIT / LOGICAL_PER_UNIT)).toFixed(1),
        h: +(h / (PX_PER_UNIT / LOGICAL_PER_UNIT)).toFixed(1),
        px: [w, h]
      }
      for (const [suffix, { base, mask }] of Object.entries(views)) {
        const out = document.createElement('canvas')
        out.width = w
        out.height = h
        const g = out.getContext('2d')
        if (shadow) {
          const bw = box.x1 - box.x0
          g.fillStyle = 'rgba(0,0,0,0.38)'
          g.beginPath()
          g.ellipse(w / 2, h - pad - 1, bw * 0.5, pad * 0.55, 0, 0, Math.PI * 2)
          g.fill()
        }
        g.drawImage(base, x0, y0, w, h, 0, 0, w, h)
        await window.saveSprite(name + suffix + '.webp', out.toDataURL('image/webp', 0.88))
        if (mask) {
          const m = document.createElement('canvas')
          m.width = w
          m.height = h
          const mg = m.getContext('2d')
          mg.drawImage(mask, x0, y0, w, h, 0, 0, w, h)
          const im = mg.getImageData(0, 0, w, h)
          for (let i = 0; i < im.data.length; i += 4) {
            const a = (im.data[i] / 255) * (im.data[i + 3] / 255)
            im.data[i] = im.data[i + 1] = im.data[i + 2] = 255
            im.data[i + 3] = Math.round(a * 255)
          }
          mg.putImageData(im, 0, 0)
          await window.saveSprite(name + suffix + '-mask.webp', m.toDataURL('image/webp', 0.9))
        }
      }
      return meta
    }
    window.saveSprite = async (name, dataUrl) => {
      const blob = await (await fetch(dataUrl)).blob()
      await fetch(`/save?name=${encodeURIComponent(name)}`, { method: 'POST', body: blob })
    }
    window.ready = true
  </script>
</body>
