<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set the theme before first paint so dark users don't see a white flash.
      try {
        var t = localStorage.getItem('carplates.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f141f')
      } catch (e) {}
    </script>
    <title>Cars UA — плати та VIN</title>
    <meta name="description" content="Пошук даних про транспортний засіб за номерним знаком або VIN-кодом." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
